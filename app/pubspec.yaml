name: agy_mobile
description: Levity-style Android/iOS remote companion for Google Antigravity.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  agy_client:
    path: packages/agy_client
  flutter_riverpod: ^2.6.1
  flutter_markdown: ^0.7.4
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^6.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
